openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: Quản lý task nội bộ
servers:
  - url: http://localhost:5000/v1
tags:
  - name: tasks
paths:
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      responses:
        '200':
          description: Danh sách task
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [tasks]
      operationId: getTaskById
      responses:
        '200':
          description: Chi tiết task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [tasks]
      operationId: patchTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [tasks]
      operationId: deleteTask
      responses:
        '204':
          description: Xoá thành công (hoặc resource đã không tồn tại)
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    Task:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [open, done]
        priority:
          type: string
          enum: [low, normal, high]
        dueDate:
          type: string
          format: date
        assigneeId:
          type: integer
    CreateTaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
        dueDate:
          type: string
          format: date
        assigneeId:
          type: integer
    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [open, done]
        priority:
          type: string
          enum: [low, normal, high]
        dueDate:
          type: string
          format: date
        assigneeId:
          type: integer
    Error:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
  responses:
    NotFound:
      description: Không tìm thấy resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Request không hợp lệ (lỗi cú pháp)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu gửi lên sai logic validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Lỗi máy chủ cục bộ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'